name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Publish to gh-pages branch
        # Old asset files are kept, so a phone still showing the previous page can load its styles and scripts.
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch gh-pages "$url" site || (mkdir site && cd site && git init -q -b gh-pages)
          find site -mindepth 1 -maxdepth 1 ! -name .git ! -name assets -exec rm -rf {} +
          cp -r dist/. site/
          cd site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}" || exit 0
          git push -q "$url" HEAD:gh-pages
